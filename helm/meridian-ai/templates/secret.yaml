{{- if or .Values.secrets.ANTHROPIC_API_KEY .Values.secrets.OPENAI_API_KEY .Values.secrets.DATABASE_URL .Values.secrets.REDIS_URL }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "meridian-ai.fullname" . }}-secret
  labels:
    {{- include "meridian-ai.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.ANTHROPIC_API_KEY }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.ANTHROPIC_API_KEY | b64enc }}
  {{- end }}
  {{- if .Values.secrets.OPENAI_API_KEY }}
  OPENAI_API_KEY: {{ .Values.secrets.OPENAI_API_KEY | b64enc }}
  {{- end }}
  {{- if .Values.secrets.DATABASE_URL }}
  DATABASE_URL: {{ .Values.secrets.DATABASE_URL | b64enc }}
  {{- end }}
  {{- if .Values.secrets.REDIS_URL }}
  REDIS_URL: {{ .Values.secrets.REDIS_URL | b64enc }}
  {{- end }}
{{- end }}
