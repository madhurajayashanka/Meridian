# Default values for meridian-frontend service
replicaCount: 3

image:
  repository: ghcr.io/meridian-research/frontend
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 3000
  fsGroup: 2000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 3000
  targetPort: 3000
  annotations: {}

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: meridian.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: meridian-frontend-tls
      hosts:
        - meridian.example.com

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - meridian-frontend
          topologyKey: kubernetes.io/hostname

livenessProbe:
  httpGet:
    path: /
    port: 3000
  initialDelaySeconds: 30
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: 3000
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 2

# Environment variables from ConfigMap
configMap:
  NODE_ENV: "production"
  NEXT_PUBLIC_API_URL: "http://api.example.com:8080"
  NEXT_PUBLIC_API_GRAPHQL_URL: "http://api.example.com:8080/graphql"
  NEXT_PUBLIC_ANALYTICS_ID: ""
  NEXT_PUBLIC_APP_VERSION: "1.0"

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# NetworkPolicy for frontend
networkPolicy:
  enabled: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: default
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # Allow egress to API service
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: meridian-api
      ports:
        - protocol: TCP
          port: 8080
    # Allow DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
    # Allow HTTPS to external APIs
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443

# Resource quotas
resourceQuota:
  enabled: false
  requests:
    cpu: 2
    memory: 2Gi
  limits:
    cpu: 4
    memory: 4Gi

# Cache configuration
cache:
  enabled: true
  maxAge: 3600  # 1 hour
  sMaxAge: 86400  # 1 day for browser cache

# Analytics and monitoring
monitoring:
  enabled: true
  metricsPort: 9090
