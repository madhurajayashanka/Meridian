# Meridian Platform Helm Chart Values
# Default values for all services

# Global settings
global:
  environment: production
  # Override via --set global.domain=yourdomain.com or APP_DOMAIN env in CI
  domain: ""  # REQUIRED — set via --set or values override

  imageRegistry: ghcr.io
  imagePullSecrets: []

  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: "true"

  tls:
    enabled: true
    issuer: letsencrypt-prod
    # Override via --set global.tls.email or TLS_EMAIL secret in CI
    email: ""  # REQUIRED — set via --set or secrets

# External Secrets Operator — pulls secrets from AWS Secrets Manager into K8s secrets
# Install ESO first: helm install external-secrets external-secrets/external-secrets -n external-secrets --create-namespace
externalSecrets:
  enabled: true
  region: us-east-1
  # Path in AWS Secrets Manager, e.g. "meridian/production/app-secrets"
  secretPath: "meridian/production/app-secrets"

# Meridian API Service Subchart
meridian-api:
  enabled: true

  replicaCount: 3

  image:
    repository: ghcr.io/meridian-research/api
    tag: latest
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080

  ingress:
    enabled: true
    hosts:
      - host: "api.{{ .Values.global.domain }}"
        paths:
          - path: /
            pathType: Prefix

  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

  # Environment variables
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: production
    - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
      value: "20"
    - name: SERVER_SERVLET_SESSION_TIMEOUT
      value: "1800s"

  # Secrets from AWS Secrets Manager
  secrets:
    existingSecret: meridian-api-secrets
    database:
      key: db-url
      envName: SPRING_DATASOURCE_URL
    redis:
      key: redis-url
      envName: SPRING_REDIS_URL
    jwt:
      key: jwt-secret
      envName: JWT_SECRET

# Meridian AI Service Subchart
meridian-ai:
  enabled: true

  replicaCount: 2

  image:
    repository: ghcr.io/meridian-research/ai
    tag: latest
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000

  ingress:
    enabled: true
    hosts:
      - host: "ai.{{ .Values.global.domain }}"
        paths:
          - path: /
            pathType: Prefix

  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1000m"

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 80

  # Environment variables
  configMap:
    ENVIRONMENT: production
    LOG_LEVEL: INFO
    MAX_CONCURRENT_REQUESTS: "10"

  # Secrets
  secrets:
    ANTHROPIC_API_KEY: ""
    OPENAI_API_KEY: ""
    DATABASE_URL: ""
    REDIS_URL: ""

# Meridian Frontend Subchart
meridian-frontend:
  enabled: true

  replicaCount: 2

  image:
    repository: ghcr.io/meridian-research/frontend
    tag: latest
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000

  ingress:
    enabled: true
    hosts:
      - host: "{{ .Values.global.domain }}"
        paths:
          - path: /
            pathType: Prefix

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "250m"

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 80

  # Environment variables
  configMap:
    NODE_ENV: production
    NEXT_PUBLIC_API_URL: "https://api.{{ .Values.global.domain }}"
    NEXT_PUBLIC_API_GRAPHQL_URL: "https://api.{{ .Values.global.domain }}/graphql"
    # NEXT_PUBLIC_APP_VERSION injected at deploy time via --set

# Monitoring and Observability
monitoring:
  enabled: true
  prometheus:
    enabled: true
    retention: 30d
    storageSize: 20Gi

  grafana:
    enabled: true
    # adminPassword — set via --set monitoring.grafana.adminPassword or GRAFANA_ADMIN_PASSWORD secret
    adminPassword: ""  # REQUIRED — never commit a real password here

# Network Policies
networkPolicy:
  enabled: true

# Pod Security Policies
podSecurityPolicy:
  enabled: true

# RBAC Configuration
rbac:
  enabled: true

# Service Accounts
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Node selection
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity rules
affinity: {}
