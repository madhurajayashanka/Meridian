apiVersion: v2
name: meridian
description: Meridian - Autonomous Multi-Agent Research Platform
type: application
version: 1.0.0
appVersion: "1.0.0"

# Chart dependencies
dependencies:
  - name: meridian-api
    version: "1.0.0"
    repository: "file://./meridian-api"
    condition: meridian-api.enabled
  
  - name: meridian-ai
    version: "1.0.0"
    repository: "file://./meridian-ai"
    condition: meridian-ai.enabled
  
  - name: meridian-frontend
    version: "1.0.0"
    repository: "file://./meridian-frontend"
    condition: meridian-frontend.enabled

maintainers:
  - name: Meridian Team
    email: team@meridian.ai

home: https://github.com/meridian-research/platform
sources:
  - https://github.com/meridian-research/platform
