services:
  minio:
    image: minio/minio:latest
    container_name: meridian-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    expose:
      - "9000"
    ports:
      - "9001:9001"  # console only — bucket API stays internal
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - meridian-network

  minio-init:
    image: minio/mc:latest
    container_name: meridian-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin};
        mc mb --ignore-existing local/${S3_BUCKET:-meridian-documents-local};
        exit 0
      "
    networks:
      - meridian-network

  postgres:
    image: ankane/pgvector:latest
    container_name: meridian-postgres
    environment:
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meridian_dev_password}
      POSTGRES_DB: meridian
    # No host port binding — only accessible within Docker network
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - meridian-network

  redis:
    image: redis:7-alpine
    container_name: meridian-redis
    # No host port binding — only accessible within Docker network
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - meridian-network

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: meridian-api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/meridian
      SPRING_DATASOURCE_USERNAME: meridian
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-meridian_dev_password}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING: "true"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      AI_SERVICE_URL: http://ai-service:8080
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      GRAPHIQL_ENABLED: ${GRAPHIQL_ENABLED:-false}
      REPORT_CONTENT_DIR: /tmp/meridian-reports
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - meridian-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8000/actuator/health > /dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: meridian-ai-service
    environment:
      DATABASE_URL: postgresql+asyncpg://meridian:${POSTGRES_PASSWORD:-meridian_dev_password}@postgres:5432/meridian
      REDIS_URL: redis://redis:6379
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-meridian-documents-local}
      S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_INTERNAL_URL: http://api:8000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - meridian-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8080/health > /dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: meridian-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_AI_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - api
      - ai-service
    networks:
      - meridian-network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  meridian-network:
    driver: bridge
