name: Deploy to Production

on:
  push:
    branches:
      - main
    paths:
      - "infra/terraform/**"
      - "helm/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches:
      - main
    paths:
      - "infra/terraform/**"
      - "helm/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

env:
  AWS_REGION: us-east-1
  TERRAFORM_VERSION: 1.5.0
  HELM_VERSION: v3.12.0

jobs:
  # Terraform plan and apply
  terraform:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: ./infra/terraform

    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform plan
        id: plan
        run: |
          terraform plan -out=tfplan -var-file=terraform.tfvars
          terraform show -json tfplan > tfplan.json

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: infra/terraform/tfplan
          retention-days: 7

      - name: Comment PR with plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/terraform/tfplan.json', 'utf8');
            const output = JSON.parse(plan);
            const changes = output.resource_changes || [];
            const message = [
              '## Terraform Plan',
              '',
              `Resources to change: ${changes.length}`,
              '',
              '```json',
              JSON.stringify(changes.slice(0, 5), null, 2),
              '```'
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });

      - name: Terraform apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve tfplan

      - name: Export outputs
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform output -json > outputs.json

      - name: Upload outputs
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs
          path: infra/terraform/outputs.json
          retention-days: 30

  # Helm deployment
  helm-deploy:
    needs: terraform
    runs-on: ubuntu-latest
    environment: production
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.28.0"

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get EKS cluster
        run: |
          aws eks update-kubeconfig --name meridian-eks-cluster --region ${{ env.AWS_REGION }}

      - name: Create namespace
        run: kubectl create namespace meridian --dry-run=client -o yaml | kubectl apply -f -

      - name: Add Helm repositories
        run: |
          helm repo add stable https://charts.helm.sh/stable
          helm repo add nginx-stable https://helm.nginx.com/stable
          helm repo add jetstack https://charts.jetstack.io
          helm repo update

      - name: Install cert-manager
        run: |
          helm upgrade --install cert-manager jetstack/cert-manager \
            --namespace cert-manager \
            --create-namespace \
            --set installCRDs=true

      - name: Install NGINX Ingress
        run: |
          helm upgrade --install nginx-ingress nginx-stable/nginx-ingress \
            --namespace ingress-nginx \
            --create-namespace \
            --values helm/ingress-values.yaml

      - name: Deploy with Helm
        run: |
          helm upgrade --install meridian ./helm \
            --namespace meridian \
            --values helm/values.yaml \
            --set meridian-api.image.tag=${{ github.sha }} \
            --set meridian-ai.image.tag=${{ github.sha }} \
            --set meridian-frontend.image.tag=${{ github.sha }} \
            --wait \
            --timeout 10m \
            --atomic

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/meridian-api -n meridian
          kubectl rollout status deployment/meridian-ai -n meridian
          kubectl rollout status deployment/meridian-frontend -n meridian

      - name: Smoke test after deploy
        id: smoke
        run: |
          API_URL=$(kubectl get svc meridian-api -n meridian -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "localhost")
          for i in {1..10}; do
            if curl -sf "http://${API_URL}:8000/actuator/health" | grep -q '"status":"UP"'; then
              echo "Smoke test passed"
              exit 0
            fi
            sleep 10
          done
          echo "Smoke test failed — triggering rollback"
          exit 1

      - name: Rollback on failure
        if: failure() && steps.smoke.outcome == 'failure'
        run: |
          helm rollback meridian --namespace meridian
          echo "Rolled back to previous release"

      - name: Get deployment info
        if: always()
        run: |
          kubectl get pods -n meridian
          kubectl get services -n meridian
          kubectl get ingress -n meridian

  # Integration and E2E tests
  e2e-tests:
    needs: helm-deploy
    runs-on: ubuntu-latest
    environment: production
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Wait for deployment
        run: |
          for i in {1..30}; do
            if curl -f http://meridian.example.com; then
              echo "Service is ready"
              exit 0
            fi
            echo "Waiting for service... ($i/30)"
            sleep 10
          done
          echo "Service failed to become ready"
          exit 1

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # Monitoring alert
  notify-deployment:
    needs: [helm-deploy, e2e-tests]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Send Slack notification
        if: failure()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "Meridian Deployment Failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Deployment Status:* ❌ Failed\n*Commit:* ${{ github.sha }}\n*Ref:* ${{ github.ref }}"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Workflow"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }

      - name: Send success notification
        if: success()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "Meridian Deployment Successful",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Deployment Status:* ✅ Success\n*Commit:* ${{ github.sha }}\n*Ref:* ${{ github.ref }}"
                  }
                }
              ]
            }
