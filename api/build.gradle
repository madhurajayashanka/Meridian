plugins {
	id 'java'
	id 'org.springframework.boot' version '3.2.0'
	id 'io.spring.dependency-management' version '1.1.4'
	id 'org.flywaydb.flyway' version '9.22.3'
	id 'jacoco'
}

group = 'com.meridian'
version = '1.0.0'
sourceCompatibility = '21'

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Spring Boot starters
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-graphql'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// Database
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-postgresql'
	runtimeOnly 'org.postgresql:postgresql'

	// JWT & Security
	implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.3'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'

	// Redis
	implementation 'redis.clients:jedis'

	// Utilities
	implementation 'org.projectlombok:lombok'
	implementation 'com.google.guava:guava:32.1.2-jre'
	implementation 'org.apache.commons:commons-lang3'
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

	// Annotation processing
	annotationProcessor 'org.projectlombok:lombok'

	// Testing
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.springframework.graphql:spring-graphql-test'
	testImplementation 'net.jqwik:jqwik:1.7.4'
	testImplementation 'org.testcontainers:testcontainers:1.19.1'
	testImplementation 'org.testcontainers:postgresql:1.19.1'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform {
		includeEngines 'jqwik', 'junit-jupiter'
	}
	
	finalizedBy jacocoTestReport
}

jacocoTestReport {
	dependsOn test
	
	reports {
		xml.required = true
		html.required = true
		csv.required = false
	}
}

// Integration tests
task integrationTest(type: Test) {
	useJUnitPlatform {
		includeTags 'integration'
	}
	shouldRunAfter test
}

// Task to check code coverage
task testCoverageVerification(type: JacocoReport) {
	executionData fileTree(project.buildDir).include('jacoco/test.exec')
	sourceDirectories.setFrom(sourceSets.main.allSource)
	classDirectories.setFrom(sourceSets.main.output)

	afterEvaluate {
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it, exclude: [
				'com/meridian/config/**',
				'com/meridian/**/dto/**',
				'com/meridian/**/exception/**'
			])
		}))
	}
}

// Flyway configuration
flyway {
	url = System.getenv('SPRING_DATASOURCE_URL') ?: 'jdbc:postgresql://localhost:5432/meridian'
	user = System.getenv('SPRING_DATASOURCE_USERNAME') ?: 'meridian'
	password = System.getenv('SPRING_DATASOURCE_PASSWORD') ?: 'meridian_dev_password'
	locations = ['filesystem:src/main/resources/db/migration']
}
